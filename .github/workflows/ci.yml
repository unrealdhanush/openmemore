name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Shared runners start processes far slower than a laptop (antivirus scanning on
      # Windows), so CI only catches gross startup regressions; the 500ms budget in
      # SPEC.md Section 4.3 is checked on real machines.
      OPENMCP_STARTUP_BUDGET_MS: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
