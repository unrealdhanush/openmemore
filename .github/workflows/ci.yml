name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Shared runners start processes far slower than a laptop (antivirus scanning on
      # Windows), so CI only catches gross startup regressions; the 500ms budget
      # is checked on real machines.
      OPENMEMORE_STARTUP_BUDGET_MS: "3000"
      # The real embedding model (~70MB) for tests marked real_model: cached between runs,
      # and a failed download fails the build instead of skipping those tests.
      OPENMEMORE_TEST_MODEL_DIR: ${{ github.workspace }}/.model-cache
      OPENMEMORE_REQUIRE_MODEL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: .model-cache
          key: embedding-model-bge-small-en-v1.5
      - run: uv sync --frozen
      - run: uv run pytest -q

  docs:
    name: docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    env:
      MINTLIFY_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: the CLI publishes several releases a day.
      - run: npx --yes mint@4.2.988 validate
      - run: npx --yes mint@4.2.988 broken-links
