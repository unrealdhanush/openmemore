[project]
name = "openmemore"
version = "0.1.0"
description = "Local-first MCP server: one shared, user-owned context store for all your AI assistants."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "httpx",
    "typer",
    "rich",
    "tomli-w",
    "pydantic>=2",
    "fastembed>=0.9.0",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
openmemore = "openmemore.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "opentelemetry-proto>=1.30",  # tests only: encodes OTLP protobuf the official way, to check our reader
    "jsonschema",  # tests only: checks exports against the published JSON Schema
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmemore"]

[tool.uv]
# sqlite-vec needs sqlite3 extension loading, which some system Pythons
# (e.g. python.org macOS builds) disable. uv's managed builds support it.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the bench/ harness is tested but not shipped
markers = ["real_model: uses the real embedding model (downloaded once to ~/.cache/openmemore-test-models)"]
