[project]
name = "openmcp"
version = "0.1.0"
description = "Local-first MCP server: one shared, user-owned context store for all your AI assistants."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "typer",
    "rich",
    "tomli-w",
    "pydantic>=2",
]

[project.scripts]
openmcp = "openmcp.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmcp"]

[tool.uv]
# sqlite-vec (M2) needs sqlite3 extension loading, which some system Pythons
# (e.g. python.org macOS builds) disable. uv's managed builds support it.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
